name: Deploy to Production

on:
  push:
    branches:
      - main
  # Manual trigger: lets a trusted collaborator (e.g. Trever) run a deploy from
  # the GitHub Actions UI without needing the production SSH key locally. Access
  # is controlled by GitHub repo permissions — only users with write access can
  # run this. The SSH key stays a repo secret, never exposed to the operator.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to palineofficial.com
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 3.151.185.242
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/paline && bash deploy-production.sh
