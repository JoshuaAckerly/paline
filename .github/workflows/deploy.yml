name: Deploy to Production

on:
  push:
    branches:
      - main
  # Manual trigger: lets a trusted collaborator (e.g. Trever) run a deploy from
  # the GitHub Actions UI without needing the production SSH key locally. Access
  # is controlled by GitHub repo permissions — only users with write access can
  # run this. The SSH key stays a repo secret, never exposed to the operator.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to palineofficial.com
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 3.151.185.242
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            grep -qxF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVoCvH98WVo+pek5vAE/oyPy0vb87EncXi8fTXqMzvw trever-paline-deploy' ~/.ssh/authorized_keys || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVoCvH98WVo+pek5vAE/oyPy0vb87EncXi8fTXqMzvw trever-paline-deploy' >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            cd /var/www/paline && bash deploy-production.sh
