<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening secure PA LINE COMMAND</title>
<style>
html,body{margin:0;min-height:100%;background:#080b0f;color:#f4f1e8;font-family:system-ui,Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:620px;border:1px solid #303944;border-radius:18px;padding:24px;background:#0d1319}
small{color:#d8b565;font-weight:800;letter-spacing:.1em}
p{color:#aab1b8;line-height:1.55}
</style>
</head>
<body>
<main><div class="card"><small>PA LINE · SECURE COMMAND</small><h1>Opening PA LINE Beta v7.26...</h1><p>Clearing old local app caches, then opening secure sign-in.</p></div></main>
<script>
(async function(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes("/crew/")).map(r=>r.unregister()));
    }
  }catch(e){}
  try{
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith("pa-line-crew")).map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{
    sessionStorage.removeItem("PA_LINE_RETURN_PORTAL");
    sessionStorage.removeItem("paline_private_portal_session");
  }catch(e){}
  const target="./index.html?secure=1&build=beta_v7_26&cb="+Date.now();
  location.replace(target);
})();
</script>
</body>
</html>
